{% extends "base_student.html" %}
{% load static %}

{% block title %}Course Catalogue{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/catalogue.css' %}?v=2">
<style>
    .filter-section {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
    }

    .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        min-width: 200px;
    }

    .filter-group label {
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.875rem;
    }

    .filter-select {
        padding: 0.75rem;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 1rem;
        cursor: pointer;
        transition: border-color 0.2s;
    }

    .filter-select:focus {
        outline: none;
        border-color: var(--primary-color);
    }
</style>
{% endblock %}

{% block content %}
<header class="page-header">
    <h1 class="page-title">My Courses</h1>
    <p class="page-subtitle">Explore subjects and lessons from your enrolled courses.</p>
</header>

<div id="catalogue-container">
    <!-- Filters will be injected here if courses exist -->
</div>

<div id="catalogue-content">
    <!-- Dynamic content will be injected here -->
</div>

<!-- Include JSON Data -->
{{ catalogue_data_json|json_script:"catalogue-data" }}

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dataElement = document.getElementById('catalogue-data');
        if (!dataElement) return;

        let catalogueData = [];
        try {
            catalogueData = JSON.parse(dataElement.textContent);
        } catch (e) {
            console.error("Could not parse catalogue data");
            return;
        }

        const container = document.getElementById('catalogue-container');
        const content = document.getElementById('catalogue-content');

        if (catalogueData.length === 0) {
            content.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon"><i class="fas fa-book-open"></i></div>
                <h3>You have not enrolled in any course yet.</h3>
                <p>Please purchase or enroll in a course to view your catalogue.</p>
            </div>
        `;
            return;
        }

        // Render Filters
        container.innerHTML = `
        <div class="filter-section animate-fade-in">
            <div class="filter-group">
                <label for="course-filter">Course</label>
                <select id="course-filter" class="filter-select">
                    <option value="all">All Courses</option>
                    ${catalogueData.map(c => `<option value="${c.id}">${c.title}</option>`).join('')}
                </select>
            </div>
            <div class="filter-group">
                <label for="subject-filter">Subject</label>
                <select id="subject-filter" class="filter-select">
                    <option value="all">All Subjects</option>
                    <!-- Subjects populated dynamically -->
                </select>
            </div>
        </div>
    `;

        const courseFilter = document.getElementById('course-filter');
        const subjectFilter = document.getElementById('subject-filter');

        function updateSubjectDropdown() {
            const selectedCourseId = courseFilter.value;
            let subjectsHtml = '<option value="all">All Subjects</option>';

            let availableSubjects = [];
            if (selectedCourseId === 'all') {
                catalogueData.forEach(c => availableSubjects.push(...c.subjects));
            } else {
                const course = catalogueData.find(c => c.id.toString() === selectedCourseId);
                if (course) availableSubjects = course.subjects;
            }

            subjectsHtml += availableSubjects.map(s => `<option value="${s.id}">${s.title}</option>`).join('');
            subjectFilter.innerHTML = subjectsHtml;
            subjectFilter.value = 'all'; // Reset subject filter when course changes
        }

        function renderCatalogue() {
            const selectedCourseId = courseFilter.value;
            const selectedSubjectId = subjectFilter.value;

            let html = '<div class="catalogue-grid">';
            let subjectsToRender = [];

            // 1. Filter Courses
            let filteredCourses = catalogueData;
            if (selectedCourseId !== 'all') {
                filteredCourses = catalogueData.filter(c => c.id.toString() === selectedCourseId);
            }

            // 2. Gather Subjects
            filteredCourses.forEach(c => {
                c.subjects.forEach(s => {
                    // Attach course title to subject for display
                    subjectsToRender.push({ ...s, courseTitle: c.title });
                });
            });

            // 3. Filter Subjects
            if (selectedSubjectId !== 'all') {
                subjectsToRender = subjectsToRender.filter(s => s.id.toString() === selectedSubjectId);
            }

            if (subjectsToRender.length === 0) {
                html = `<p style="color: var(--text-secondary); padding: 2rem 0;">No subjects found for the selected filters.</p>`;
            } else {
                subjectsToRender.forEach(subject => {
                    const nodeUrl = `/node/${subject.id}/`;
                    html += `
                <div class="card animate-fade-in" onclick="window.location.href='${nodeUrl}'" style="cursor: pointer;">
                    <div class="card-tag">${subject.courseTitle}</div>
                    <h3 class="card-title">${subject.title}</h3>
                    <p class="card-desc">${subject.description || "Explore topics in this subject."}</p>
                    <div class="card-footer">
                        <div class="card-meta">
                            <span class="meta-item">
                                <i class="fas fa-layer-group"></i> ${subject.topics_count} Items
                            </span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap: 0.5rem; width:60%;">
                            <a href="${nodeUrl}" style="display:block; text-align:center; background:var(--primary-light); color:var(--item-link-color); padding:0.5rem; border-radius:6px; text-decoration:none; font-weight:500; transition:all 0.2s;">View Items</a>
                        </div>
                    </div>
                </div>
                `;
                });
                html += '</div>';
            }

            content.innerHTML = html;
        }

        // Event Listeners
        courseFilter.addEventListener('change', () => {
            updateSubjectDropdown();
            renderCatalogue();
        });

        subjectFilter.addEventListener('change', renderCatalogue);

        // Initial Render
        updateSubjectDropdown();
        renderCatalogue();
    });
</script>
{% endblock %}
