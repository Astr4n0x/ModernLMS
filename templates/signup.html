{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup | ModernLMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v=20260328">
    <style>
        .auth-section.hidden {
            display: none !important;
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <!-- Animated Background -->
    <div class="background-animation">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>

    <main class="login-wrapper">
        <div class="login-container" id="login-container">

            <div class="login-header">
                <div class="brand">
                    <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
                    <span class="brand-text">ModernLMS</span>
                </div>
                <h1>Welcome Back!</h1>
                <p>Create an account to access courses and materials.</p>
            </div>

            <!-- Login/Signup option removed from the top -->

            {% if messages %}
            <div class="error-banner show" id="error-banner" aria-live="polite">
                <i class="fas fa-exclamation-circle"></i>
                <span>{% for msg in messages %}{{ msg }}{% endfor %}</span>
            </div>
            {% else %}
            <div class="error-banner" id="error-banner" aria-live="polite">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-message">Invalid credentials. Please try again.</span>
            </div>
            {% endif %}

            <!-- SIGNUP FORM -->
            <form id="signup-section" class="auth-section" method="POST" action="{% url 'accounts:signup' %}">
                {% csrf_token %}

                <div class="form-row">
                    <div class="input-group">
                        <label for="first_name" class="input-label">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="last_name" class="input-label">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="phone" class="input-label">Phone Number</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone input-icon"></i>
                            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="class_level" class="input-label">Class</label>
                        <div class="input-wrapper select-wrapper">
                            <i class="fas fa-graduation-cap input-icon"></i>
                            <select id="class_level" name="class_level" required>
                                <option value="" disabled selected>Select</option>
                                <option value="Class 1">Class 1</option>
                                <option value="Class 2">Class 2</option>
                                <option value="Class 3">Class 3</option>
                                <option value="Class 4">Class 4</option>
                                <option value="Class 5">Class 5</option>
                                <option value="Class 6">Class 6</option>
                                <option value="Class 7">Class 7</option>
                                <option value="Class 8">Class 8</option>
                                <option value="Class 9">Class 9</option>
                                <option value="Class 10">Class 10</option>
                                <option value="Class 11">Class 11</option>
                                <option value="Class 12">Class 12</option>
                            </select>
                            <i class="fas fa-chevron-down select-arrow"></i>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="signup_password" class="input-label">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="signup_password" name="password" placeholder="Password" required>
                            <button type="button" class="password-toggle" data-target="signup_password" aria-label="Toggle password visibility">
                                <i class="fas fa-eye toggle-icon"></i>
                            </button>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirm_password" class="input-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
                            <button type="button" class="password-toggle" data-target="confirm_password" aria-label="Toggle password visibility">
                                <i class="fas fa-eye toggle-icon"></i>
                            </button>
                            <div class="input-focus-border"></div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="login-btn action-btn">
                    <span class="btn-text">Sign Up</span>
                    <i class="fas fa-user-plus btn-icon"></i>
                    <div class="btn-spinner"><i class="fas fa-circle-notch fa-spin"></i></div>
                </button>
                
                <div class="login-footer">
                    <p>Already have an account? <a href="{% url 'accounts:login' %}" class="login-link-text">Log In</a></p>
                </div>
            </form>
        </div>
    </main>

    <script src="{% static 'js/login.js' %}?v=20260328"></script>

</body>
</html>
